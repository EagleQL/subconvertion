name = "subconvertion"
main = "src/worker.js"
compatibility_date = "2024-11-05"
workers_dev = true
compatibility_flags = ["nodejs_compat_v2"]
# workers.dev is often blocked in mainland China; the custom domain is reachable directly
routes = [{ pattern = "subconvertion.tangri.top", custom_domain = true }]
# PROFILES is a plain-text variable edited in the dashboard (it contains subscription tokens,
# so it must never be committed here); keep dashboard variables across deploys
keep_vars = true

[vars]
# 逗号分隔, 按顺序尝试, 前一个失败(非 200 / 超时 / 网络错误)则换下一个
BACKEND = "https://api.v1.mk,https://subapi.cmliussss.net,https://subapi.fxxk.dedyn.io"
# FIXED_NODES 是固定节点的 JSON 数组，只放在 Cloudflare 的 Worker 变量里，不要写进公开仓库。
# 未写 tiers 时每个节点会生成普通名和「原名-HQ」两个名字，由模板正则按名字归组，并进入临替分组。

[[r2_buckets]]
binding = "SUB_BUCKET"
bucket_name = "sub"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = true

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1
