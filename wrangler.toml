name = "subconvertion"
main = "src/worker.js"
compatibility_date = "2024-11-05"
workers_dev = true
compatibility_flags = ["nodejs_compat_v2"]

[vars]
BACKEND = "https://api.dler.io"

[[r2_buckets]]
binding = "SUB_BUCKET"
bucket_name = "sub"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = true

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1
