name = "subconvertion"
main = "src/worker.js"
compatibility_date = "2024-11-05"
workers_dev = true
compatibility_flags = ["nodejs_compat_v2"]

[vars]
# 逗号分隔, 按顺序尝试, 前一个失败(非 200 / 超时 / 网络错误)则换下一个
BACKEND = "https://api.v1.mk,https://subapi.cmliussss.net,https://subapi.fxxk.dedyn.io"

[[r2_buckets]]
binding = "SUB_BUCKET"
bucket_name = "sub"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = true

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1
